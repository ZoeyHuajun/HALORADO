<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <link rel="stylesheet" href="{{ url_for('static', filename='bootstrap/bootstrap.4.6.min.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/init.css') }}">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <!-- 需要修改这里的js文件-->
    <script src="{{ url_for('static',filename='jquery.3.6.minjs') }}"></script>
    <title>HALORADO - {% block title %}{% endblock %}</title>
    {% block head_details %}
    {% endblock %}
</head>

<body>
    <nav class="navbar navbar-expand-lg navbar-light bg-light">
        <div class="container">
            <a class="navbar-brand" href="#">HALORADO</a>
            <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarSupportedContent">
                <ul class="navbar-nav mr-auto">
                    <li class="nav-item active">
                        <a class="nav-link" href="/">Home <span class="sr-only">(current)</span></a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#">RECIPES</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#">PUBLISH</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#">QUESTION BOARD</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#">HALO Robot</a>
                    </li>
                    <li class="nav-item ml-2">
                        <form class="form-inline my-2 my-lg-0" method="GET" action="#">
                            <input class="form-control mr-sm-2" type="search" placeholder="KEY WORD" aria-label="Search" name="q">
                            <button class="btn btn-outline-success my-2 my-sm-0" type="submit">Search</button>
                        </form>
                    </li>
                </ul>
                <ul class="navbar-nav">
                    <li class="nav-item">
                        <a class="nav-link" href="#">Login</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#">Register</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>
    <main>
        {% block main %}
        {% endblock %}
    </main>
    <footer class="bg-light text-center text-lg-start mt-5">
        <div class="text-center p-3">
            © 2026 HALORADO. All rights reserved.
        </div>
</body>

</html>
