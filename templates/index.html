{% extends "base.html" %}

{% block title %} HOME {% endblock %}
{% block head_details %} 
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/index.css') }}">
{% endblock %}
{% block main %}
<main class="container mx-auto px-4 py-8 flex-1">
    <div class="flex flex-col lg:flex-row gap-8">
        <!-- 左侧：文章列表 -->
        <div class="w-full lg:w-3/4">
            <!-- 文章列表 -->
            <div class="space-y-6">
                {% for recipe in recipes %}
                    <!-- 文章卡片 1 -->
                    <article class="card-hover bg-white rounded-xl overflow-hidden shadow-md transition-all duration-300">
                        <div class="flex flex-col md:flex-row">
                            <div class="w-full md:w-56 flex-shrink-0">
                                <img src="{{recipe.picture}}"
                                    alt="{{recipe.name}}"
                                    class="w-full h-56 object-cover">
                            </div>
                            <div class="flex-1 p-6">
                                <h3 class="text-xl font-bold text-gray-900 mb-2">
                                    <a href="/detail/{{recipe.id}}">{{ recipe.name }}</a>
                                </h3>
                                <p class="text-gray-600 mb-4 line-clamp-2">
                                    {{recipe.content}}</p>
                                <div class="flex items-center justify-between text-sm text-gray-500">
                                    <span>recipe.pub.date</span>
                                </div>
                            </div>
                        </div>
                    </article>
                {% endfor %}
            </div>
                        <!-- page -->
            <div class="mt-10 flex justify-center">
                <nav class="flex items-center space-x-2">
                    <button class="px-4 py-2 rounded-lg bg-gray-200 text-gray-700 font-medium hover:bg-gray-300 transition-colors">
                        上一页
                    </button>
                    <button class="px-4 py-2 rounded-lg bg-green-500 text-white font-medium hover:bg-green-600 transition-colors">
                        1
                    </button>
                    <button class="px-4 py-2 rounded-lg bg-white text-gray-700 font-medium hover:bg-gray-100 transition-colors">
                        2
                    </button>
                    <button class="px-4 py-2 rounded-lg bg-white text-gray-700 font-medium hover:bg-gray-100 transition-colors">
                        3
                    </button>
                    <button class="px-4 py-2 rounded-lg bg-white text-gray-700 font-medium hover:bg-gray-100 transition-colors">
                        下一页
                    </button>
                </nav>
            </div>
        </div>
    </div>
</main>
{% endblock %}
